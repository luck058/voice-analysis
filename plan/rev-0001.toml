[[item]]
id = "signal_basics"
title = "Test-signal synthesis, FFT spectrum and level meter maths"
description = """
Three modules. See architecture.md for conventions.

src/testing/synth.ts: deterministic signal generators. Every function returns a
new Float32Array.
- sine(hz, sampleRate, length, amplitude = 0.5, phase = 0).
- harmonicTone(hz, sampleRate, length, harmonics = 10, amplitude = 0.5): the sum
  of harmonics k = 1..harmonics with relative amplitude 1/k (a band-limited
  sawtooth), omitting any harmonic at or above sampleRate / 2, scaled so the
  largest absolute sample equals `amplitude`.
- vibratoTone(hz, rateHz, extentCents, sampleRate, length, amplitude = 0.5): a
  sine whose instantaneous frequency is hz * 2^(extentCents * sin(2*pi*rateHz*t) / 1200),
  generated by integrating the frequency (phase accumulation), so there are no jumps.
- whiteNoise(length, amplitude, seed): uniform in [-amplitude, amplitude] from the
  mulberry32 PRNG seeded with `seed`. The same seed always gives the same samples.
- pulseTrain(periodsSec: number[], sampleRate, amplitudes?: number[]): one pulse
  per period. Pulse i starts at the sum of periods 0..i-1 (in samples, rounded to
  the nearest sample) and is a raised-cosine bump 1 ms wide whose peak is
  amplitudes[i] (default 1). Output length = round(sum(periodsSec) * sampleRate).
- resonate(signal, sampleRate, formants: {hz: number, bandwidthHz: number}[]):
  the signal passed through a cascade of Klatt (1980) two-pole resonators, one per
  formant: C = -exp(-2*pi*bw/fs), B = 2*exp(-pi*bw/fs)*cos(2*pi*f/fs), A = 1 - B - C,
  y[n] = A*x[n] + B*y[n-1] + C*y[n-2] (unity gain at 0 Hz). Used to synthesise vowels.
- mix(a, b): sample-wise sum, length of the longer input.
- scaleToRms(signal, dbfs): a copy scaled so its RMS level is `dbfs` dBFS.

src/dsp/fft.ts:
- hannWindow(size): symmetric Hann, w[n] = 0.5 - 0.5*cos(2*pi*n/(size-1)).
- fft(re: Float64Array, im: Float64Array): void. In-place iterative radix-2 FFT.
  Throws RangeError if the lengths differ or are not a power of two.
- magnitudeSpectrumDb(frame: Float32Array): Float32Array of frame.length/2 + 1
  values. Applies a Hann window and normalises by sum(window)/2, so a sine of
  amplitude 1 exactly at a bin centre reads 0 dB (within 0.5 dB) at that bin.
  Every value is floored at -120 dB: never -Infinity, never NaN.
- binFrequency(bin, sampleRate, frameSize) = bin * sampleRate / frameSize.

src/dsp/level.ts:
- rmsDbfs(frame): 20*log10(RMS). A full-scale sine reads -3.01 dB.
- peakDbfs(frame): 20*log10(max |sample|).
- Both return -120 for silence (all zeros) and never go below -120.

Tests (colocated): fft of [1, 2, 3, 4, 0, 0, 0, 0] against a hand-computed DFT; a
sine exactly at bin 100 of a 2048-sample frame at 48 kHz peaks at bin 100 with
0 +/- 0.5 dB at amplitude 1 and -6.02 +/- 0.5 dB at amplitude 0.5; RangeError for
length 1000; silence gives -120 in every bin; rmsDbfs of a full-scale sine is
-3.01 +/- 0.05; whiteNoise is identical for the same seed, differs for another
seed, and stays within bounds; harmonicTone's peak equals `amplitude`; pulseTrain
length and pulse peak positions; vibratoTone's zero-crossing rate over 1 s is
within 1% of hz; the magnitude spectrum of resonate() applied to a single-sample
impulse has a local maximum within 3% of each formant frequency.
"""
satisfies = [
    "R4",
    "R5",
]
files = [
    "src/testing/synth.ts",
    "src/testing/synth.test.ts",
    "src/dsp/fft.ts",
    "src/dsp/fft.test.ts",
    "src/dsp/level.ts",
    "src/dsp/level.test.ts",
]
lang = "typescript"

[[item]]
id = "notes"
title = "Convert between frequency, MIDI note numbers, note names and cents"
description = """
src/music/notes.ts (see NoteInfo in architecture.md):
- hzToMidi(hz, a4 = A4_HZ): 69 + 12*log2(hz/a4), fractional.
- midiToHz(midi, a4 = A4_HZ): the inverse.
- noteName(midi: number): string for an integer MIDI number, sharps only, in
  scientific pitch notation: 60 -> \"C4\", 61 -> \"C#4\", 69 -> \"A4\", 21 -> \"A0\".
- hzToNote(hz, a4 = A4_HZ): NoteInfo. midi is the nearest integer MIDI number,
  name is the note name without octave (\"C#\"), octave is its octave, and cents is
  100 * (fractional MIDI - midi), always in [-50, 50): a pitch exactly 50 cents
  above a note belongs to the next note at -50.
- hzToMidi and hzToNote throw RangeError when hz is not a finite number above 0.

Tests: 440 Hz -> A4, 0 cents; 261.63 -> C4 within 0.1 cents of 0; 466.16 -> A#4;
445 -> A4 +19.56 +/- 0.1 cents; 27.5 -> A0; a4 = 442 makes 442 Hz exactly A4;
the 50-cent boundary; midiToHz(hzToMidi(x)) round-trips; RangeError for 0, -1, NaN.
"""
satisfies = [
    "R2",
]
files = [
    "src/music/notes.ts",
    "src/music/notes.test.ts",
]
lang = "typescript"

[[item]]
id = "pitch"
title = "Detect the fundamental frequency of a frame with YIN"
description = """
src/dsp/pitch.ts: detectPitch(frame: Float32Array, sampleRate: number,
options?: { minHz?: number; maxHz?: number; threshold?: number }): PitchResult | null.
Defaults: minHz = PITCH_MIN_HZ, maxHz = PITCH_MAX_HZ, threshold = 0.15.

Method (YIN): difference function d(tau) for tau up to sampleRate/minHz; the
cumulative mean normalised difference d'(tau); the first tau in
[sampleRate/maxHz, sampleRate/minHz] where d' drops below `threshold`, then walk
to the bottom of that dip; parabolic interpolation around it for a fractional
lag; hz = sampleRate / lag. clarity = 1 - d'(lag), clamped to [0, 1].

Returns null when rmsDbfs(frame) < SILENCE_DBFS, when no lag in range goes below
the threshold, or when the result would fall outside [minHz, maxHz]. Throws
RangeError when the frame is shorter than 2 * sampleRate / minHz samples.

Speed matters (it runs about 90 times a second): 50 calls on 2048-sample frames at
48 kHz must take under 2 seconds in total in the test environment.

Tests, 2048-sample frames at 48 kHz from src/testing/synth.ts: sines at 70, 110,
220, 440, 880 and 1000 Hz (amplitude 0.5) are within 0.5% and have clarity above
0.9; harmonicTone at 100, 200, 400 and 800 Hz is within 1% (no octave errors);
all zeros -> null; a 220 Hz sine scaled to -70 dBFS -> null; whiteNoise at
amplitude 0.5 with seeds 1 to 10 -> null for at least 9 of the 10; a 1000 Hz sine
with maxHz = 500 never returns a value above 500; a 1000-sample frame with the
default minHz throws RangeError; the speed bound above.
"""
satisfies = [
    "R2",
]
depends = [
    "signal_basics",
]
files = [
    "src/dsp/pitch.ts",
    "src/dsp/pitch.test.ts",
]
lang = "typescript"
decision = "YIN (de Cheveigné and Kawahara, 2002) with parabolic interpolation."
rationale = "Plain autocorrelation makes octave errors on voices with strong harmonics; YIN's cumulative-mean-normalised difference avoids most of them at the same cost, and is what most tuner and singing apps use."
alternatives = "Autocorrelation (octave errors); McLeod's MPM (comparable, less widely documented); a neural pitch tracker (out of scope: no ML)."

[[item]]
id = "formants"
title = "Estimate formant frequencies with linear prediction (LPC)"
description = """
src/dsp/formants.ts: estimateFormants(frame: Float32Array, sampleRate: number,
options?: { maxFormantHz?: number; order?: number; maxFormants?: number }): Formant[].
Defaults: maxFormantHz = 5500, order = 10, maxFormants = 4.

Recommended method: low-pass and resample the frame to 2 * maxFormantHz (a
windowed-sinc FIR low-pass, then linear interpolation is enough); pre-emphasis
y[n] = x[n] - a*x[n-1] with a = exp(-2*pi*50/fs); a Hamming window;
autocorrelation of lags 0..order; Levinson-Durbin for the LPC coefficients; the
roots of the LPC polynomial (Durand-Kerner iteration or companion-matrix
eigenvalues). Each complex root r with positive angle gives
hz = angle(r) * fs / (2*pi) and bandwidthHz = -ln(|r|) * fs / pi.

Keep roots with 90 < hz < maxFormantHz - 50 and bandwidthHz < 400, sorted by
frequency ascending, at most maxFormants. Return [] for silence
(rmsDbfs < SILENCE_DBFS). Never return NaN.

Tests. Synthesise a vowel with pulseTrain at f0 = 120 Hz for 0.1 s at 48 kHz,
passed through resonate() with the vowel's F1, F2 and F3 = 2500 Hz (bandwidths
80, 100 and 120 Hz); analyse the middle 2048 samples. The first two estimated
formants must each be within 12% or 40 Hz (whichever is larger) of the true
value for: [ɑ] F1 730, F2 1090; [i] F1 270, F2 2290; [u] F1 300, F2 870;
[æ] F1 660, F2 1720. At f0 = 220 Hz, [ɑ] with F1 850, F2 1220 must be within 15%.
Silence -> []. Every returned formant has hz ascending and bandwidthHz < 400.
"""
satisfies = [
    "R6",
]
depends = [
    "signal_basics",
]
files = [
    "src/dsp/formants.ts",
    "src/dsp/formants.test.ts",
]
lang = "typescript"
decision = "Autocorrelation LPC after resampling to 2 x maxFormantHz, formants from the polynomial roots, as Praat does."
rationale = "LPC is the standard formant method and needs no training data; resampling first keeps the model order small and the estimate stable."
alternatives = "Cepstral peak picking (less accurate on high voices); a learned model (out of scope)."

[[item]]
id = "voice_quality"
title = "Measure jitter, shimmer and harmonics-to-noise ratio"
description = """
src/dsp/voiceQuality.ts: measureVoiceQuality(samples: Float32Array,
sampleRate: number, f0Hz: number): VoiceQuality | null.

- Cycle marks: one per cycle at the largest absolute sample, searched for within
  each expected period given f0Hz (search windows of about +/-20% of a period
  around where the next cycle is expected), refined to a sub-sample position by
  parabolic interpolation. Periods T_i are the differences between consecutive
  marks; amplitudes A_i are the absolute peak values at the marks.
- jitterPercent = 100 * mean(|T_i - T_{i+1}|) / mean(T)   (Praat \"jitter (local)\").
- shimmerPercent = 100 * mean(|A_i - A_{i+1}|) / mean(A)  (Praat \"shimmer (local)\").
- hnrDb = 10 * log10(r / (1 - r)), where r is the largest normalised
  autocorrelation over lags within +/-10% of sampleRate / f0Hz, clamped to
  [0.0001, 0.9999].
- Returns null when there are fewer than 10 complete cycles, when rmsDbfs is below
  SILENCE_DBFS, or when f0Hz is outside [PITCH_MIN_HZ, PITCH_MAX_HZ]. Never NaN.

Tests, 48 kHz, signals from src/testing/synth.ts:
- pulseTrain of 60 periods of exactly 1/150 s -> jitter < 0.5, shimmer < 0.5, hnr > 20.
- periods alternating 1.02/150 and 0.98/150 s (true jitter 4%) -> jitter in [3, 5].
- amplitudes alternating 1.05 and 0.95 at a constant period (true shimmer 10%) ->
  shimmer in [8, 12].
- The same clean train mixed with whiteNoise so the noise is 20 dB and then 5 dB
  below the train's RMS: hnr(clean) > hnr(20 dB) > hnr(5 dB).
- 5 periods -> null; all zeros -> null; f0Hz = 30 -> null.
Use the unfiltered pulse train for jitter and shimmer (a resonator's ringing
blurs cycle peaks).
"""
satisfies = [
    "R7",
]
depends = [
    "signal_basics",
]
files = [
    "src/dsp/voiceQuality.ts",
    "src/dsp/voiceQuality.test.ts",
]
lang = "typescript"
decision = "Praat's local jitter and local shimmer from cycle-by-cycle peak marks; HNR from the normalised autocorrelation at the period lag."
rationale = "These are the measures voice-training and speech-therapy apps report, and Praat's definitions are the reference that published norms use."
alternatives = "Cepstral peak prominence (a better single score for breathiness, harder to explain to a beginner)."

[[item]]
id = "vibrato"
title = "Detect vibrato rate and extent from a pitch track"
description = """
src/analysis/vibrato.ts (see PitchPoint and Vibrato in architecture.md):
detectVibrato(track: PitchPoint[], options?: { minRateHz?: number;
maxRateHz?: number; minExtentCents?: number }): Vibrato | null.
Defaults: minRateHz = 3, maxRateHz = 9, minExtentCents = 10.

- Points are in time order but may be irregular. A gap of more than 0.1 s between
  points splits the track; use the longest contiguous run. It must span at least
  1.0 s and hold at least 20 points, else null.
- Remove a least-squares linear trend (a singer drifting sharp is not vibrato).
- rateHz: from the dominant periodicity of the detrended run (for example, count
  zero crossings, or the autocorrelation peak after resampling to 100 points per
  second).
- extentCents: half the mean peak-to-trough excursion of the detrended run.
- null when rateHz is outside [minRateHz, maxRateHz] or extentCents < minExtentCents.

Tests: points every 10 ms for 2 s with cents = 50*sin(2*pi*5.5*t) -> rate 5.5 +/- 0.3
and extent 50 +/- 5; the same plus a drift of +100 cents per second -> rate
5.5 +/- 0.3 and extent 50 +/- 7; a flat track -> null; 20 cents at 1 Hz -> null
(too slow); 5 cents at 6 Hz -> null (too small); 0.8 s of good vibrato -> null;
a 0.3 s gap in the middle of 3 s of vibrato still gives the right rate.
"""
satisfies = [
    "R8",
]
files = [
    "src/analysis/vibrato.ts",
    "src/analysis/vibrato.test.ts",
]
lang = "typescript"

[[item]]
id = "vowel_chart"
title = "Reference vowels, vowel-chart coordinates and nearest vowel"
description = """
src/views/vowelChart.ts:
- interface ReferenceVowel { symbol: string; example: string; f1: number; f2: number }
- REFERENCE_VOWELS: Record<\"men\" | \"women\", ReferenceVowel[]>, exactly these values
  (symbol, example word, F1, F2):
  men:   i heed 270 2290; ɪ hid 390 1990; ɛ head 530 1840; æ had 660 1720;
         ɑ hod 730 1090; ɔ hawed 570 840; ʊ hood 440 1020; u who'd 300 870;
         ʌ hud 640 1190; ɝ heard 490 1350.
  women: i heed 310 2790; ɪ hid 430 2480; ɛ head 610 2330; æ had 860 2050;
         ɑ hod 850 1220; ɔ hawed 590 920; ʊ hood 470 1160; u who'd 370 950;
         ʌ hud 760 1400; ɝ heard 500 1640.
- hzToBark(hz) = 13*atan(0.00076*hz) + 3.5*atan((hz/7500)^2)  (Zwicker).
- chartPosition(f1, f2, width, height): { x, y }. The usual vowel-chart
  orientation: front vowels (high F2) on the LEFT, open vowels (high F1) at the
  BOTTOM. x = width * (bark(3000) - bark(f2)) / (bark(3000) - bark(500));
  y = height * (bark(f1) - bark(200)) / (bark(1000) - bark(200)); both clamped to
  [0, width] and [0, height].
- nearestVowel(f1, f2, set: \"men\" | \"women\"): { vowel: ReferenceVowel; distanceBark: number },
  Euclidean distance on (bark(f1), bark(f2)).
- referenceSetFor(medianF0Hz: number): \"men\" below 165 Hz, else \"women\".

Tests: each reference vowel is its own nearest with distance 0; (700, 1100) ->
ɑ in the men's set; [i] is left of and above [ɑ]; [u] is right of [i] at a
similar height; clamping at the edges; hzToBark(1000) is 8.5 +/- 0.1;
referenceSetFor(120) = \"men\", referenceSetFor(210) = \"women\".
"""
satisfies = [
    "R6",
]
files = [
    "src/views/vowelChart.ts",
    "src/views/vowelChart.test.ts",
]
lang = "typescript"
decision = "Peterson and Barney (1952) average F1/F2 for American English monophthongs, men's and women's sets, compared on the Bark scale."
rationale = "The most widely cited reference table, so the chart matches what accent-training material shows; Bark distances weigh F1 and F2 differences as a listener hears them."
alternatives = "Hillenbrand et al. (1995) values (more recent, less familiar); speaker normalisation (needs calibration, deferred)."

[[item]]
id = "spectrogram_view"
title = "Scrolling spectrogram image model with a log frequency axis"
description = """
src/views/spectrogram.ts: class SpectrogramModel.
- constructor(options: { width: number; height: number; sampleRate: number;
  frameSize: number; minHz?: number; maxHz?: number; minDb?: number; maxDb?: number }).
  Defaults: minHz 50, maxHz 8000, minDb -100, maxDb -20.
- image: Uint8ClampedArray of width*height*4 RGBA bytes, row 0 at the top.
  Starts opaque black (0, 0, 0, 255).
- hzForRow(row): log-spaced; row 0 = maxHz, row height-1 = minHz.
  rowForHz(hz): the inverse, rounded to the nearest row and clamped to [0, height-1].
- colourFor(db): [r, g, b]. Clamp db to [minDb, maxDb], map to t in [0, 1], and
  interpolate linearly between these five stops at t = 0, 0.25, 0.5, 0.75, 1:
  (0, 0, 4), (81, 18, 124), (183, 55, 121), (252, 137, 97), (252, 253, 191).
- push(spectrumDb: Float32Array): shift every row left by one pixel and draw the
  new column at x = width-1. Each row's value is the spectrum at hzForRow(row),
  linearly interpolated between the two nearest bins (bin = hz * frameSize / sampleRate).
  Alpha stays 255.

Tests: dimensions and initial black; hzForRow(0) = maxHz and
hzForRow(height-1) = minHz; rowForHz(hzForRow(r)) = r; colourFor(minDb) and
colourFor(maxDb) are the end stops; colourFor below minDb clamps; relative
luminance increases across 11 evenly spaced dB values; after pushing the
magnitudeSpectrumDb of a 1 kHz sine (2048 samples, 48 kHz), the brightest pixel in
the last column is within 2 rows of rowForHz(1000); after a second push, that
column has moved one pixel left.
"""
satisfies = [
    "R4",
]
depends = [
    "signal_basics",
]
files = [
    "src/views/spectrogram.ts",
    "src/views/spectrogram.test.ts",
]
lang = "typescript"

[[item]]
id = "pitch_trace_view"
title = "Scrolling pitch-trace model on a semitone grid"
description = """
src/views/pitchTrace.ts: class PitchTraceModel.
- constructor(options: { width: number; height: number; windowSec?: number;
  minMidi?: number; maxMidi?: number }). Defaults: windowSec 8, minMidi 40 (E2),
  maxMidi 84 (C6).
- add(timeSec: number, hz: number | null): record a point (null = unvoiced).
  Points more than windowSec older than the newest are discarded.
- xForTime(timeSec, nowSec): nowSec at x = width, nowSec - windowSec at x = 0, linear.
- yForMidi(midi): maxMidi at y = 0, minMidi at y = height, linear in (fractional)
  MIDI, clamped to [0, height].
- segments(nowSec): { x: number; y: number }[][]. Consecutive voiced points form a
  segment; an unvoiced point, or a gap of more than 0.1 s, starts a new one.
  Single-point segments are kept (drawn as dots). Uses hzToMidi from src/music/notes.ts.
- gridLines(): { y: number; midi: number; label: string; isC: boolean }[], one per
  integer MIDI number from minMidi to maxMidi, label from noteName (e.g. \"C4\").

Tests: x and y mapping at the ends; a 3-point voiced run gives one segment of 3
points; voiced, null, voiced gives two segments; a 0.2 s gap splits; points older
than the window are dropped; gridLines has maxMidi - minMidi + 1 entries and
marks exactly the C notes; 440 Hz maps to yForMidi(69).
"""
satisfies = [
    "R3",
]
depends = [
    "notes",
]
files = [
    "src/views/pitchTrace.ts",
    "src/views/pitchTrace.test.ts",
]
lang = "typescript"

[[item]]
id = "analyser"
title = "Frame assembly and the per-frame analyser that runs every measure"
description = """
src/analysis/frames.ts: class FrameAssembler.
- constructor(options: { sampleRate: number; frameSize?: number; hopSize?: number;
  historySec?: number }). Defaults FRAME_SIZE, HOP_SIZE, historySec 3.
- push(chunk: Float32Array): Float32Array[]. Returns, in order, every complete
  frame that became available. Frame k covers stream samples
  [k*hopSize, k*hopSize + frameSize). Each returned frame is a copy.
- history(seconds): Float32Array of the most recent min(seconds, historySec,
  available) seconds of contiguous audio.
- samplesSeen: number (getter).

src/analysis/analyser.ts: createAnalyser(sampleRate: number):
{ process(frame: Float32Array, timeSec: number): FrameAnalysis; reset(): void }.
Frames are assumed consecutive, HOP_SIZE apart. For each frame:
- levelDbfs = rmsDbfs(frame); spectrumDb = magnitudeSpectrumDb(frame);
- pitch = detectPitch(frame, sampleRate), with note = hzToNote(pitch.hz), or null;
- formants = estimateFormants(frame, sampleRate) when voiced, else [];
- voice quality: while voiced, append the newest HOP_SIZE samples of each frame to
  a voiced-audio buffer (an unvoiced frame empties it). Each time 0.5 s of new
  voiced audio has accumulated, recompute measureVoiceQuality on the last 0.5 s
  with the median f0 of the frames in it. Report the latest value (null until the
  first); reset() clears it.
- vibrato: keep (timeSec, 1200*log2(hz/440)) for voiced frames from the last 2 s;
  vibrato = detectVibrato(track).

Tests (48 kHz, audio fed through FrameAssembler in 128-sample chunks, as the
browser delivers it): 5000 samples yield floor((5000 - 2048) / 512) + 1 = 6 frames,
frame k starting at sample k*512 (use a ramp signal to check); history(0.01) has
480 samples; 1.5 s of harmonicTone at 220 Hz gives pitch within 1% of 220 and
note \"A\" octave 3 on every frame, and a non-null voiceQuality with jitter < 1 by
the end; 2 s of vibratoTone(220, 5.5 Hz, 50 cents) gives a vibrato of 5.5 +/- 0.5 Hz
and 50 +/- 15 cents by the end; silence gives pitch null and formants []; at 48 kHz
the analyser produces more than 20 analyses per second of audio (it produces 93.75).
The whole test file must run in under 10 seconds.
"""
satisfies = [
    "R1",
    "R2",
    "R6",
    "R7",
    "R8",
]
depends = [
    "signal_basics",
    "notes",
    "pitch",
    "formants",
    "voice_quality",
    "vibrato",
]
files = [
    "src/analysis/frames.ts",
    "src/analysis/frames.test.ts",
    "src/analysis/analyser.ts",
    "src/analysis/analyser.test.ts",
]
lang = "typescript"

[[item]]
id = "session_summary"
title = "Session statistics and plain-language feedback"
description = """
src/analysis/session.ts:
- class SessionStats, constructor(frameDurationSec = HOP_SIZE / DEFAULT_SAMPLE_RATE).
  add(a: FrameAnalysis): void. summary(): SessionSummary.
- interface SessionSummary { totalSec: number; voicedSec: number;
  lowestHz: number | null; highestHz: number | null; medianHz: number | null;
  lowestNote: string | null; highestNote: string | null; medianNote: string | null;
  rangeSemitones: number | null; inTunePercent: number | null;
  averageLevelDbfs: number | null; voiceQuality: VoiceQuality | null;
  vibrato: Vibrato | null }.
  Each added frame counts frameDurationSec; voiced frames are those with pitch.
  lowestHz and highestHz are the 5th and 95th percentiles of voiced pitch (so a
  single glitch does not set the range); notes use noteName of the nearest MIDI
  number (\"A3\"); rangeSemitones is the rounded difference in MIDI between them;
  inTunePercent is the percentage of voiced frames with |cents| <= 25;
  averageLevelDbfs is over voiced frames; voiceQuality and vibrato are the last
  non-null values seen. Fields are null when nothing was voiced.
- describeSession(s: SessionSummary): string[]. Three to six plain-English
  sentences, no unexplained jargon:
  1. how long they were voicing (\"You sang or spoke for 12 seconds.\");
  2. the range (\"Your pitch went from G2 to D4, a range of 19 semitones.\") and the
     typical note with its frequency;
  3. tuning (\"You were within a quarter of a semitone of a note 62% of the time.
     Trained singers usually manage 80% or more.\");
  4. when voice quality is known: steady or unsteady by jitter under or over 1.04%,
     even or uneven loudness by shimmer under or over 3.81%, clear or breathy by
     HNR over or under 20 dB (Praat's usual reference thresholds), each in words;
  5. when vibrato is known: its rate and extent, noting that classical singers'
     vibrato is typically 5 to 7 per second.
  With nothing voiced: exactly one sentence saying no voice was detected and
  suggesting they check the microphone is allowed and not muted.

Tests build FrameAnalysis objects directly (no audio): 100 frames at 220 Hz and 100
at 440 Hz -> lowestNote A3, highestNote A4, rangeSemitones 12; one outlier frame at
1000 Hz among 200 does not change highestNote; half the voiced frames 40 cents off
-> inTunePercent 50; empty -> summary fields null and describeSession returns one
sentence containing \"microphone\"; the jitter wording flips at 1.04%; no sentence
contains \"NaN\", \"undefined\" or \"null\".
"""
satisfies = [
    "R9",
    "R10",
]
depends = [
    "notes",
    "analyser",
]
files = [
    "src/analysis/session.ts",
    "src/analysis/session.test.ts",
]
lang = "typescript"

[[item]]
id = "app_controller"
title = "Start/Stop controller, microphone errors, and the metric catalogue"
description = """
src/app/controller.ts: createController(deps: { startAudio: () => Promise<{ stop(): void }>;
onChange?: (state: ControllerState) => void }): Controller.
- type ControllerState = { status: \"idle\" | \"starting\" | \"running\" | \"error\";
  errorMessage: string | null }.
- Controller: { readonly state: ControllerState; start(): Promise<void>; stop(): void }.
- start() from idle or error: status \"starting\", then \"running\" when startAudio
  resolves; if it rejects, status \"error\" with a message chosen by the error's name:
  NotAllowedError or SecurityError: \"Microphone access was blocked. Click the
  microphone icon in the address bar, allow access, then press Start again.\";
  NotFoundError or OverconstrainedError: \"No microphone was found. Plug one in or
  check your sound settings, then press Start again.\";
  NotReadableError: \"The microphone is being used by another app. Close it, then
  press Start again.\";
  anything else: \"This browser could not start recording. Use a recent Chrome,
  Edge, Firefox or Safari, opened at http://localhost or over https.\"
- start() while starting or running does nothing. stop() while running calls the
  audio handle's stop() and returns to idle; otherwise it does nothing.
- onChange is called on every status change, with the new state.

src/app/metrics.ts:
- interface MetricInfo { id: string; label: string; unit: string; explanation: string }.
- METRICS: MetricInfo[] with exactly these ids: pitch, note, cents, level,
  pitchTrace, spectrogram, formants, vowel, jitter, shimmer, hnr, vibratoRate,
  vibratoExtent. Each explanation is one or two plain sentences (at most 220
  characters) saying what it means for the user's voice, e.g. for cents:
  \"How far you are from the nearest note. 100 cents is one semitone; within
  plus or minus 10 sounds in tune to most listeners.\"
- formatReadouts(a: FrameAnalysis | null): { id; label; value: string; explanation }[]
  for the numeric metrics (pitch \"220.0 Hz\", note \"A3\", cents \"+3 ¢\" or \"-12 ¢\",
  level \"-18 dBFS\" rounded to whole dB, formants \"F1 730 Hz · F2 1090 Hz\", jitter
  \"0.42 %\", shimmer \"2.1 %\", hnr \"21 dB\", vibratoRate \"5.5 Hz\", vibratoExtent
  \"48 ¢\"), with the value \"—\" when unavailable (a null analysis gives \"—\" for all).

Tests: the state sequence idle -> starting -> running -> idle with a fake
startAudio, and that stop() reaches the handle; each error name gives its
message and a later start() can succeed; a second start() while starting calls
startAudio once; METRICS ids are unique and complete, every explanation is
non-empty and at most 220 characters; formatReadouts formats a sample
FrameAnalysis exactly as above and gives \"—\" throughout for null.
"""
satisfies = [
    "R2",
    "R5",
    "R7",
    "R8",
    "R10",
    "R11",
]
depends = [
    "notes",
    "analyser",
]
files = [
    "src/app/controller.ts",
    "src/app/controller.test.ts",
    "src/app/metrics.ts",
    "src/app/metrics.test.ts",
]
lang = "typescript"

[[item]]
id = "app_ui"
title = "The page: microphone capture, panels, painters and the render loop"
description = """
src/app/render.ts (pure: builds HTML strings and paints onto a context passed in;
tests use a fake context that records calls):
- renderReadoutsHtml(readouts): one element per readout with data-metric=\"<id>\",
  its label, its value, and its explanation visible in a <details> element next
  to it (and as a title attribute). All text is HTML-escaped.
- renderSummaryHtml(sentences: string[]) and renderErrorHtml(message: string),
  escaped.
- paintSpectrogram(ctx, model: SpectrogramModel): one putImageData of the model's
  pixels (create the image with ctx.createImageData(width, height)).
- paintPitchTrace(ctx, model: PitchTraceModel, nowSec, width, height): grid lines
  (C notes stronger, labelled with fillText), then each segment as a path with
  moveTo and lineTo (single points as small arcs).
- paintVowelChart(ctx, point: { f1: number; f2: number } | null, set, width, height):
  every reference vowel's symbol with fillText at chartPosition, the current point
  as a filled circle, and the nearest vowel highlighted.
- paintLevelMeter(ctx, dbfs, width, height): a bar from -60 to 0 dBFS.

src/app/audio.ts (browser only, never imported by tests):
startMicrophone(onChunk: (samples: Float32Array) => void): Promise<{ sampleRate: number; stop(): void }>.
getUserMedia with echoCancellation, noiseSuppression and autoGainControl all
false (they distort pitch and formant measures); an AudioContext; an
AudioWorklet processor, loaded from a Blob URL, that posts a copy of channel 0 of
each input block to the main thread. stop() stops the tracks and closes the context.

src/main.ts and index.html and src/style.css: a single page. A header with the
title and ONE large Start/Stop button. Panels: a large tuner-style readout (note,
Hz, cents), the level meter, the pitch trace (last 8 s), the spectrogram, the
vowel chart, and voice quality and vibrato readouts; each panel shows its
explanation from METRICS. Start runs the controller; audio chunks go through a
FrameAssembler to the analyser; each FrameAnalysis updates the models and a
SessionStats; painting happens on requestAnimationFrame. The vowel chart uses
referenceSetFor(median pitch so far). On Stop, show renderSummaryHtml(
describeSession(stats.summary())). On error, show renderErrorHtml with Start
enabled. Canvases scale with devicePixelRatio. No new npm dependencies.

Tests (render.ts only): escaping of \"<script>\"; every readout's explanation
appears; paintSpectrogram calls putImageData once with the model's width and
height; paintPitchTrace draws one path per segment and labels each C grid line;
paintVowelChart writes all ten vowel symbols; renderErrorHtml includes the message.
"""
satisfies = [
    "R1",
    "R3",
    "R4",
    "R5",
    "R6",
    "R9",
    "R10",
    "R11",
    "R12",
]
depends = [
    "app_controller",
    "session_summary",
    "spectrogram_view",
    "pitch_trace_view",
    "vowel_chart",
]
files = [
    "src/app/render.ts",
    "src/app/render.test.ts",
    "src/app/audio.ts",
    "src/main.ts",
    "src/style.css",
    "index.html",
]
lang = "typescript"
decision = "AudioWorklet capture into the FrameAssembler, not polling an AnalyserNode."
rationale = "Voice quality and vibrato need contiguous audio; an AnalyserNode polled at the display rate gives overlapping, gapped snapshots."
alternatives = "AnalyserNode.getFloatTimeDomainData on requestAnimationFrame (simpler, but gaps); ScriptProcessorNode (deprecated)."
